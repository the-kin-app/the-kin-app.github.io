<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min</title>

<!-- ══════════════════════════════════════════════════════════
     A signpost, not a page.

     /b/ was the variant homepage until 2026-09-16, when it became the
     homepage itself and /waitlist/ took over as the other side of the
     test. The Worker stopped sending anyone here the moment it was
     deployed, so this file exists for the people the Worker can no
     longer reach:

       - anyone with /b/?l=…&p=…&v=b&s=… in their browser history, which
         is every scan that drew the b side while the old split was live
       - a scan caught mid-flight between the Worker deploy and the
         Pages rebuild
       - the /b/ URLs written into this repo's own README history

     Without it those are a 404, and a 404 on a URL a poster produced is
     the one outcome worth a stub this small.

     The query string is carried through so a straggler still signs up
     attributed to the poster that brought them. ?v= is dropped: it named
     a page that no longer exists, and the homepage declares its own side
     anyway (<html data-variant>).

     Delete this once the old /b/ URLs have aged out of history —
     nothing generates them any more.
     ══════════════════════════════════════════════════════════ -->
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://hellomin.app/">

<!-- The no-JS path. Runs immediately, and loses the query string, which is
     the honest trade: a visitor with JavaScript off cannot be attributed
     anyway, because the signup form needs JS to post at all. -->
<meta http-equiv="refresh" content="0; url=/">

<script>
(function () {
  try {
    var q = new URLSearchParams(location.search);
    q.delete('v');                       // named a page that is gone
    var s = q.toString();
    // replace(), not assign(): the back button should go where the visitor
    // came from, not bounce them through here again.
    location.replace('/' + (s ? '?' + s : '') + location.hash);
  } catch (e) { location.replace('/'); }
})();
</script>
</head>
<body>
<p>Moved to <a href="/">hellomin.app</a>.</p>
</body>
</html>
