<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kin — Scan to Join</title>
<link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
</head>
<body class="center">

<div class="container text-center" style="max-width:380px;">
  <img class="logo" src="/assets/img/logo.png" alt="Kin" width="1392" height="1130">
  <div class="tagline">Where strangers become Kin</div>

  <div class="card">
    <h1 class="card__title">Scan to join the waitlist</h1>
    <p class="card__sub">Point your camera at the code below.</p>

    <div class="qr-box">
      <img src="/assets/img/qr-waitlist.png" alt="QR code linking to the Kin waitlist page" width="220" height="220">
    </div>

    <div class="url">
      <a href="https://kinapp.social/waitlist/">kinapp.social/waitlist</a>
    </div>
  </div>

  <a class="back-link" href="/waitlist/">← Back to the waitlist page</a>
</div>

</body>
</html>
