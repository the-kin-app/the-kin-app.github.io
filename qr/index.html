<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min — Scan to join</title>
<meta name="description" content="A QR code pointing at the Min waitlist, for printing and pinning up.">
<meta name="theme-color" content="#2A2320">
<!-- A print/utility page, not a destination: it holds a QR code that points
     at /waitlist/, so it has nothing to offer anyone who finds it in search.
     noindex rather than a robots.txt Disallow — a blocked page can never be
     crawled, so the crawler would never read this tag. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://hellomin.app/qr/">

<link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
</head>
<body class="center">

<div class="container text-center" style="max-width:380px;">
  <img class="logo" src="/assets/img/min-logo-flat.svg" alt="Min" width="138" height="68">
  <div class="tagline">Where strangers become kin</div>

  <div class="card">
    <h1 class="card__title">Scan to join the waitlist</h1>
    <p class="card__sub">Point your camera at the code below.</p>

    <div class="qr-box">
      <img src="/assets/img/qr-waitlist.png" alt="QR code linking to the Min waitlist page" width="220" height="220">
    </div>

    <div class="url">
      <a href="https://hellomin.app/waitlist/">hellomin.app/waitlist</a>
    </div>
  </div>

  <a class="back-link" href="/waitlist/">← Back to the waitlist page</a>
</div>

</body>
</html>
