<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kin — Join the waitlist</title>
<meta name="description" content="Be first in when Kin launches in Helsinki. Leave a name and one way to reach you — an email or a phone number, never both. No spam, ever.">
<meta name="theme-color" content="#1e1b2e">
<link rel="canonical" href="https://kinapp.social/waitlist/">

<meta property="og:title" content="Join the Kin waitlist">
<meta property="og:description" content="Be first in when Kin launches in Helsinki. No spam, ever.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kinapp.social/waitlist/">
<meta property="og:site_name" content="Kin">
<meta property="og:locale" content="en">
<meta property="og:image" content="https://kinapp.social/assets/img/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Min, Kin's companion: a softly glowing pebble with two lit eyes, floating in dusk light.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kinapp.social/assets/img/og-cover.jpg">

<link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
</head>
<body class="center bg-photo">

<div class="container">
  <div class="logo" role="img" aria-label="Kin">
    <img class="logo__mark" src="/assets/img/logo-wordmark.png" alt="" width="1392" height="1130">
    <span class="logo__dot" aria-hidden="true"></span>
  </div>
  <div class="tagline">Where strangers become kin</div>

  <div class="card card--hero">
    <img class="card__bg" src="/assets/img/card.svg" alt="" aria-hidden="true">
    <div class="card__content">
    <div id="form-view">
      <h1 class="card__title">Join the waitlist</h1>
      <p class="card__sub">Be first to know when Kin launches. No spam, ever.</p>

      <form id="waitlist-form" class="form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input class="input" type="text" id="name" name="name" placeholder="First name or nickname" required autocomplete="given-name">
          <div class="field-error" id="name-error"></div>
        </div>

        <div class="field">
          <label>How should we reach you?</label>
          <div class="segmented" role="tablist">
            <span class="segmented__pill" aria-hidden="true"></span>
            <button type="button" id="tab-email" class="active">Email</button>
            <button type="button" id="tab-phone">Phone</button>
          </div>
        </div>

        <div class="field field--contact" id="email-field">
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" aria-label="Email">
          <div class="field-error" id="email-error"></div>
        </div>

        <div class="field field--contact" id="phone-field" style="display:none;">
          <input class="input" type="tel" id="phone" name="phone" placeholder="+1 555 123 4567" autocomplete="tel" aria-label="Phone number">
          <div class="field-error" id="phone-error"></div>
        </div>

        <!-- Honeypot: hidden from humans, bots tend to fill it. Leave empty. -->
        <input class="visually-hidden" type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" class="btn btn--block btn--mt submit"><span class="btn__label">Submit</span></button>
        <p class="consent">By joining, you agree to our <a href="/privacy-policy/">Privacy Policy</a>.</p>
        <div class="status" id="form-status"></div>
      </form>
    </div>

    <div id="success-view" class="success-view">
      <div class="check">🎉</div>
      <h2>You're on the list</h2>
      <p>We'll email or text you the moment Kin is ready.</p>
    </div>
    </div>
  </div>

  <div class="footer-note">We'll only use your details to let you know when Kin launches.</div>
</div>

<script src="/assets/js/waitlist.js"></script>

</body>
</html>
