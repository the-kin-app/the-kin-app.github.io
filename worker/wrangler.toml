name = "kin-waitlist"
main = "src/index.js"
compatibility_date = "2026-07-24"

# Custom domain routes. Both hosts are live on purpose.
#
# api.hellomin.app is the current name. api.kinapp.social CANNOT be retired:
# it is the URL printed on the QR posters hanging in Otaniemi, Viikki, Hanken
# and the other places in LOCATIONS (src/index.js). Printed paper is not
# redeployable, so dropping this route breaks every poster already on a wall.
#
# Each host needs its own zone's DNS on Cloudflare (see worker/README.md
# "Exposing the Worker").
routes = [
  { pattern = "api.hellomin.app", custom_domain = true },
  { pattern = "api.kinapp.social", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "kin-waitlist"
database_id = "fde4602f-58b3-4a8a-ba97-031a38848892"     # from `wrangler d1 create kin-waitlist`
migrations_dir = "migrations"

[vars]
# Single value, echoed straight into Access-Control-Allow-Origin (corsHeaders
# in src/index.js). It cannot hold two origins, so it names the live site only.
# kinapp.social 301s at the Cloudflare edge, so nothing ever POSTs from it.
ALLOW_ORIGIN = "https://hellomin.app"
# Where GET /<location>/<poster> sends a scan. Same host as the static site.
SITE_ORIGIN = "https://hellomin.app"

# The survey linked from the welcome email. Set = the mail carries the ask and
# the patch that comes with it (welcomeWithSurvey in src/emails.js); unset =
# the plain welcome, rather than a button pointing at nothing. The page lives
# at /survey/ in this repo and posts back to POST /survey here.
SURVEY_URL = "https://hellomin.app/survey/"

# Native Workers rate limiting: 5 requests per 60s per key (per IP, see
# src/index.js). The binding only supports fixed 10s/60s periods.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Poster scans get their own namespace. Sharing RATE_LIMITER with the forms
# would let a burst of scans from one network 429 somebody's actual signup.
# Over the limit only skips the counter row — the redirect still happens, so
# nobody scanning a poster ever sees an error.
#
# Set high on purpose. Mobile carrier NAT puts a lot of phones behind one
# address, and a busy campus could plausibly produce dozens of scans a minute
# from a single IP; anything tighter silently undercounts. This is here to
# stop a trivial flood burning D1 writes, not to police real traffic.
[[ratelimits]]
name = "SCAN_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

# ADMIN_TOKEN and RESEND_API_KEY are secrets, not vars — set them with:
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put RESEND_API_KEY
# RESEND_API_KEY powers the transactional emails (templates + send helper in
# src/emails.js). If unset, signups still work — the email is just skipped.
